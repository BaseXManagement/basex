# Server Port
server.port=8080

########################################################################################################################
#   JWT Configurations
########################################################################################################################
spring.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B625064536751234567
spring.app.jwtExpirationMs=3600000

########################################################################################################################
#   DATABASE CONFIG - LOCAL DEVELOPMENT
########################################################################################################################

# Local database credentials
spring.datasource.username=root
spring.datasource.password=admin

# Local database URL
spring.datasource.url=jdbc:mysql://localhost:3306/basex

# MySQL driver class and dialect for Hibernate
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

########################################################################################################################
#   DATABASE SCHEMA INITIALIZATION - MIXED (HIBERNATE AND SQL SCRIPTS)
########################################################################################################################

# Enable script-based initialization for development
spring.sql.init.mode=always

# Allow Hibernate to defer initialization until the DataSource is ready
spring.jpa.defer-datasource-initialization=true

# Set Hibernate DDL generation for development (create, update, create-drop, validate)
spring.jpa.hibernate.ddl-auto=update

########################################################################################################################
#   DEBUGGING TOOLS
########################################################################################################################

# Enable detailed debug logs for troubleshooting SQL and connection issues
#logging.level.org.springframework=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=DEBUG
#logging.level.org.springframework.security=DEBUG

# View SQL queries in console with formatted output
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
